# Cassandra dashboard for Grafana, built against the metric names this cluster
# actually emits.
#
# ORGANISED INTO SIX COLLAPSIBLE ROWS. Rows that should be on screen during the
# talk are open; the reference rows are collapsed so the dashboard fits a
# projector without scrolling:
#
#   [open]      Traffic & Latency        rate, latency, per-node reads, clients
#   [open]      Errors, Drops & Hints    the row that PROVES a claim
#   [collapsed] JVM & GC                 heap, GC time, pause duration, G1 pools
#   [collapsed] Storage & Compaction     pending compactions, disk, partitions, cache
#   [collapsed] Kubernetes Resources     pod CPU, CFS throttling, memory, node CPU
#   [open]      Disk Capacity            the row that exists because of an outage
#
# TWO DATASOURCES, on purpose:
#   Cassandra's own metrics  -> our kube-prometheus-stack, via "${datasource}"
#   cAdvisor / node / kubelet -> OpenShift Thanos, uid "openshift-thanos"
# Our stack does not scrape the kubelet, so container_cpu_* and
# kubelet_volume_stats_* live only in the platform's monitoring.
#
# THE JOB FILTER ON jvm_* IS LOAD-BEARING. Reaper exports jvm_gc_collection_seconds_*
# and jvm_memory_bytes_* under exactly the same names. Without
# job="demo-dc1-all-pods-service" the JVM row charts Reaper's 344MB heap instead
# of Cassandra's 8GB one, and looks entirely plausible while doing it.
#
# WHY "Errors, Drops & Hints" IS AN OPEN ROW: during the scale-out and pod-kill
# demos the claim is "zero failed requests". The errors panel is the evidence for
# that claim, and the hints panel shows Cassandra repairing itself on screen as
# the killed node rejoins and its backlog of hints is replayed.
#
# WHY THE CACHE PANEL IS DELIBERATELY FLAT ZERO: Cassandra 5.0 defaults to the
# BTI sstable format, whose trie index is memory-mapped and bypasses the key
# cache entirely. Every tuning guide that tells you to size key_cache_size is
# describing 4.x. The panel is kept BECAUSE it is zero -- a metric that reads
# zero for a known reason is worth more than one nobody ever charted.
#
# Two things Cassandra cannot tell you about itself, both in the Kubernetes rows:
#   - a cgroup quota can cap throughput while tpstats looks perfectly healthy
#   - a full disk trips commit_failure_policy=stop and the node shuts down while
#     its pod stays 3/3 Running, so nothing in kubectl looks wrong either
# The disk row was added after exactly that took two of three nodes down during
# a rehearsal: 50Gi PVCs, a 3-hour sustained write job, and 66 sstables that UCS
# could not merge fast enough. Storage must be sized for write throughput x
# duration, not for the logical dataset size.
#
# NOTE: kubelet_volume_stats_* returns DUPLICATE series through Thanos, so every
# disk query wraps in max by (persistentvolumeclaim) to dedupe.
#
# The dropped-messages query filters to > 0 on purpose: all 87 message types are
# exported per node (522 series on a 6-node ring) and the zeros drown the signal.
#
# DO NOT replace this with a community k8ssandra dashboard. Those target the
# deprecated MCAC endpoint (collectd_mcac_*). Cassandra 5 exposes
# org_apache_cassandra_metrics_* via the management API, so they render empty.
#
# Latency is in MICROSECONDS (verified: coordinator p50 ~847us vs nodetool's
# 21us local write latency).
#
# The Grafana sidecar picks this up via the grafana_dashboard label.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-cassandra
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  cassandra.json: |
    {
      "title": "Cassandra (k8ssandra)",
      "uid": "k8ssandra-cassandra",
      "tags": [
        "cassandra",
        "k8ssandra"
      ],
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "prometheus"
            },
            "hide": 0,
            "label": "Cassandra datasource"
          }
        ]
      },
      "panels": [
        {
          "id": 101,
          "title": "Traffic & Latency",
          "description": "What the cluster is actually serving, as Cassandra sees it.",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 1,
          "title": "Client request rate by type",
          "description": "Throughput as Cassandra sees it, not as the load generator reports it.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (request_type) (rate(org_apache_cassandra_metrics_client_request_latency_count{request_type=~\"Read|Write\"}[1m]))",
              "legendFormat": "{{request_type}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "normal"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 2,
          "title": "Client request latency",
          "description": "Units verified as microseconds: coordinator p50 ~847us vs nodetool's 21us local write.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 1,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.99, sum by (request_type, le) (rate(org_apache_cassandra_metrics_client_request_latency_bucket{request_type=~\"Read|Write\"}[1m])))",
              "legendFormat": "p99 {{request_type}}",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "histogram_quantile(0.50, sum by (request_type, le) (rate(org_apache_cassandra_metrics_client_request_latency_bucket{request_type=~\"Read|Write\"}[1m])))",
              "legendFormat": "p50 {{request_type}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "\u00b5s",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 3,
          "title": "Read rate per node",
          "description": "Uneven lines here are the noisy-neighbour signature.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (rate(org_apache_cassandra_metrics_client_request_latency_count{request_type=\"Read\"}[1m]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 14,
          "title": "Connected native clients",
          "description": "Driver connections per node. The load generator's pool should spread evenly; a node with none is not taking traffic, whatever nodetool status says.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 9,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (org_apache_cassandra_metrics_client_connected_native_clients)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 102,
          "title": "Errors, Drops & Hints",
          "description": "The row that proves a claim. Everything here should be flat zero on a healthy cluster -- which is exactly why it is worth screen space during a failure demo.",
          "type": "row",
          "collapsed": false,
          "gridPos": {
            "x": 0,
            "y": 17,
            "w": 24,
            "h": 1
          },
          "panels": []
        },
        {
          "id": 15,
          "title": "Client request errors  [SHOULD BE FLAT ZERO]",
          "description": "Timeouts, unavailables and failures. This is the panel that answers \"how do you know the scale-out and the pod kill cost nothing?\" -- a flat zero line here IS the evidence. Unavailables mean fewer replicas were up than the consistency level needed; timeouts mean replicas were up but too slow.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(org_apache_cassandra_metrics_client_request_timeouts_total{request_type=~\"Read|Write\"}[1m]))",
              "legendFormat": "Timeouts",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(org_apache_cassandra_metrics_client_request_unavailables_total{request_type=~\"Read|Write\"}[1m]))",
              "legendFormat": "Unavailables",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(org_apache_cassandra_metrics_client_request_failures_total{request_type=~\"Read|Write\"}[1m]))",
              "legendFormat": "Failures",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 16,
          "title": "Dropped messages by type",
          "description": "Cassandra sheds internode messages it cannot service within their timeout rather than queueing forever. MUTATION drops mean writes were silently lost and only repair will fix them. Filtered to > 0 because all 87 message types are exported per node and the zeros drown everything out.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 18,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (message_type) (rate(org_apache_cassandra_metrics_dropped_message_dropped_total[1m])) > 0",
              "legendFormat": "{{message_type}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 17,
          "title": "Hinted handoff",
          "description": "When a replica is down, the coordinator stores a hint and replays it on rejoin. This is the panel that lights up during the pod-kill demo: Created/s climbs while the node is gone, then Delivered/s spikes as it comes back. It is Cassandra repairing itself in real time, on screen. Uses storage_total_hints rather than hints_service_hints_created_<ip>, which bakes the peer address into the METRIC NAME -- eleven separate metrics that rate() cannot aggregate, because stripping __name__ leaves eleven identical label sets and Prometheus refuses the query.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 0,
            "y": 26,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(org_apache_cassandra_metrics_storage_total_hints[1m]))",
              "legendFormat": "Created/s",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(org_apache_cassandra_metrics_hints_service_hints_succeeded_total[1m]))",
              "legendFormat": "Delivered/s",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(org_apache_cassandra_metrics_hints_service_hints_failed_total[1m]))",
              "legendFormat": "Failed/s",
              "refId": "C"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(rate(org_apache_cassandra_metrics_hints_service_hints_timed_out_total[1m]))",
              "legendFormat": "Timed out/s",
              "refId": "D"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum(org_apache_cassandra_metrics_storage_total_hints_in_progress)",
              "legendFormat": "In flight (count)",
              "refId": "E"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "ops",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": [
              {
                "matcher": {
                  "id": "byName",
                  "options": "In flight (count)"
                },
                "properties": [
                  {
                    "id": "custom.axisPlacement",
                    "value": "right"
                  },
                  {
                    "id": "unit",
                    "value": "short"
                  },
                  {
                    "id": "custom.lineStyle",
                    "value": {
                      "fill": "dash",
                      "dash": [
                        10,
                        10
                      ]
                    }
                  }
                ]
              }
            ]
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 6,
          "title": "Thread pool pending tasks",
          "description": "Zero pending while throughput is capped means the bottleneck is OUTSIDE Cassandra.",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "x": 12,
            "y": 26,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "expr": "sum by (pod) (org_apache_cassandra_metrics_thread_pools_pending_tasks)",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "stacking": {
                  "mode": "none"
                }
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "table",
              "placement": "bottom",
              "calcs": [
                "lastNotNull",
                "max"
              ]
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 103,
          "title": "JVM & GC",
          "description": "Cassandra is a JVM application. Container memory graphs cannot show heap pressure, and GC pauses are the most common cause of latency spikes.",
          "type": "row",
          "collapsed": true,
          "gridPos": {
            "x": 0,
            "y": 34,
            "w": 24,
            "h": 1
          },
          "panels": [
            {
              "id": 18,
              "title": "JVM heap used vs max",
              "description": "Panel 11 shows CONTAINER memory, which is heap + off-heap + page cache and cannot show heap pressure. This can. Note the job filter: Reaper exports jvm_* under the same names, so without it you are charting Reaper's heap.",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": {
                "x": 0,
                "y": 35,
                "w": 12,
                "h": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (pod) (jvm_memory_bytes_used{job=\"demo-dc1-all-pods-service\",area=\"heap\"})",
                  "legendFormat": "{{pod}}",
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "max(jvm_memory_bytes_max{job=\"demo-dc1-all-pods-service\",area=\"heap\"})",
                  "legendFormat": "Xmx",
                  "refId": "B"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes",
                  "min": 0,
                  "custom": {
                    "lineWidth": 2,
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    }
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "table",
                  "placement": "bottom",
                  "calcs": [
                    "lastNotNull",
                    "max"
                  ]
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "id": 19,
              "title": "GC time as % of wall clock",
              "description": "Seconds of GC per second of elapsed time. Both DataStax and Instaclustr call GC pauses the single most common cause of Cassandra latency spikes. Sustained G1 Old Generation above zero means the collector is losing; correlate any p99 spike on panel 2 with this before blaming disk.",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": {
                "x": 12,
                "y": 35,
                "w": 12,
                "h": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (pod, gc) (rate(jvm_gc_collection_seconds_sum{job=\"demo-dc1-all-pods-service\"}[5m]))",
                  "legendFormat": "{{pod}} / {{gc}}",
                  "refId": "A"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "percentunit",
                  "min": 0,
                  "custom": {
                    "lineWidth": 2,
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    }
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "table",
                  "placement": "bottom",
                  "calcs": [
                    "lastNotNull",
                    "max"
                  ]
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
              }
            },
            {
              "id": 20,
              "title": "Average GC pause duration",
              "description": "rate(sum)/rate(count) -- mean stop-the-world pause per collection. G1's target is 500ms by default; young-gen pauses of tens of milliseconds are healthy. Any Old Generation pause at all is worth investigating.",
              "type": "timeseries",
              "datasource": {
                "type": "prometheus",
                "uid": "${datasource}"
              },
              "gridPos": {
                "x": 0,
                "y": 43,
                "w": 12,
                "h": 8
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (gc) (rate(jvm_gc_collection_seconds_sum{job=\"demo-dc1-all-pods-service\"}[5m])) / clamp_min(sum by (gc) (rate(jvm_gc_collection_seconds_count{job=\"demo-dc1-all-pods-service\"}[5m])), 0.0001)",
                  "legendFormat": "{{gc}} avg pause",
                  "refId": "A"
                },
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "${datasource}"
                  },
                  "expr": "sum by (gc) (rate(jvm_gc_collection_seconds_count{job=\"demo-dc1-all-pods-service\"}[5m]))",
                  "legendFormat": "{{gc}} collections/s",
                  "refId": "B"
                }
              ],
              "fieldConfig": {
                "defaults": {
                  "unit": "s",
                  "min": 0,
                  "custom": {
                    "lineWidth": 2,
                    "fillOpacity": 10,
                    "stacking": {
                      "mode": "none"
                    }
                  }
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "table",
                  "placement": "bottom",
                  "calcs": [
                    "lastNotNull",
                    "max"
                  ]
                },
                "tooltip": {
                  "mode": "multi",
                  "sort": "desc"
                }
