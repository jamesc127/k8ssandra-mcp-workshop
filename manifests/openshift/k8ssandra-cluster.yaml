# OPENSHIFT PROFILE — sized for the 5-worker IBM TechZone cluster.
#
# Differences from the EKS profiles (manifests/cassandra/), all forced by the
# platform rather than chosen:
#   - Racks map to NODES, not AZs. This cluster has no
#     topology.kubernetes.io/zone labels at all, so rack-per-AZ is impossible.
#     manifests/openshift/node-labels.sh applies k8ssandra.io/rack instead.
#   - Storage is Ceph RBD via ODF, not EBS gp3. There is no iops/throughput
#     knob; the external Ceph cluster provides the performance.
#   - Medusa backs up to NooBaa's in-cluster S3, not AWS S3, so there is no
#     IRSA service account — credentials come from an ObjectBucketClaim.
#
# cass-operator detects OpenShift automatically (openshift.mode=auto) and omits
# runAsUser/runAsGroup so the restricted-v2 SCC can assign the namespace UID
# range. No anyuid grant should be needed.
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: demo
  namespace: default
spec:
  cassandra:
    serverVersion: "5.0.8"
    datacenters:
      - metadata:
          name: dc1
          annotations:
            # storageConfig is IMMUTABLE on an existing CassandraDatacenter.
            # Without this, changing the PVC size makes the validating webhook
            # reject the ENTIRE CassandraDatacenter write - so every other
            # config change in this CR silently stops being applied too. The
            # symptom is a CR that stores your settings while the nodes keep
            # running the old ones; check `kubectl get k8ssandracluster demo
            # -o jsonpath='{.status.error}'`.
            cassandra.datastax.com/allow-storage-changes: "true"
        # Deploy at 3 (one pod per node), scale to 6 live during the talk.
        #
        # Ring size must stay a multiple of 3 so the racks stay balanced.
        size: 3

        # This cluster has only 3 Cassandra nodes, and cass-operator's default
        # hard pod anti-affinity allows one Cassandra pod per node — which would
        # fix the ring at 3 and make the scale-under-load demo impossible.
        # Allowing 2 pods per node gets us 3 -> 6 with racks still balanced
        # (2 per rack), and 2 x 12 CPU fits inside a 32 vCPU worker.
        #
        # Be honest about this on stage: two replicas on one node means losing
        # that node costs two of three replicas, so an RF=3 keyspace at
        # LOCAL_QUORUM would go unavailable for those ranges. The /expert skill
        # calls this out as "defensible only for dev/CI/workshop" and it is
        # right. The EKS full profile (9 nodes, 9 pods) does not need it.
        softPodAntiAffinity: true

        # Synthetic racks. Cassandra treats a rack as a logical failure domain —
        # it does not care whether that maps to an AZ, a physical rack, or a
        # node. What matters is that there are 3 of them: the default
        # allocate_tokens_for_local_replication_factor=3 cannot allocate tokens
        # with fewer, and the bootstrap stalls rather than erroring.
        racks:
          - name: rack1
            nodeAffinityLabels:
              k8ssandra.io/rack: rack1
          - name: rack2
            nodeAffinityLabels:
              k8ssandra.io/rack: rack2
          - name: rack3
            nodeAffinityLabels:
              k8ssandra.io/rack: rack3


        # The Vector log-tailer sidecar ships with a 128Mi limit and sits at
        # 119-122Mi in steady state - no headroom at all. During a scale-under-load
        # rehearsal it OOMKilled (exit 137) on multiple pods.
        #
        # Nothing was actually wrong with Cassandra: it stayed at ~9.9 GiB of its
        # 32 GiB limit and never left the ring. But the POD reported 2/3 Ready, so
        # anything watching pod readiness saw a degraded cluster that was fine.
        # (That is the exact inverse of the disk-full failure, where the pod said
        # 3/3 Running and Cassandra was dead. Neither direction is trustworthy on
        # its own.)
        containers:
          - name: server-system-logger
            # This sidecar is Vector, and its whole job is to tail ONE file
            # (/var/log/cassandra/system.log, a few hundred KB) and echo it to
            # stdout so `kubectl logs` works.
            #
            # Vector sizes its worker pool from the CPU count it can see. This
            # container has no CPU limit, so it sees the whole node -- 32 cores
            # -- and starts ~34 threads. The memory cost is per-thread allocator
            # arenas, NOT buffered log data: nothing is backing up, and the
            # working set is flat (measured +0.2 MiB over four days).
            #
            # MEASURED on this cluster, identical image, idle:
            #   stock              34 threads   157 MiB
            #   VECTOR_THREADS=2    4 threads    33 MiB
            #
            # That is why 128Mi OOMKilled during the 3->6 scale-up: Vector's
            # normal floor was already ABOVE the limit. It was not a burst and
            # not a leak, so raising the ceiling was treating the symptom.
            # Capping the thread count fixes the cause, and 128Mi is then real
            # headroom over an ~80 MiB steady state rather than a ceiling to
            # creep towards.
            env:
              - name: VECTOR_THREADS
                value: "2"
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 128Mi
        storageConfig:
          cassandraDataVolumeClaimSpec:
            # ODF default StorageClass. Ceph RBD is block storage (RWO), which
            # is what Cassandra wants. Note the binding mode is Immediate, not
            # WaitForFirstConsumer — fine here because RBD volumes are network
            # attached and not pinned to a node.
            storageClassName: ocs-storagecluster-ceph-rbd
            accessModes:
              - ReadWriteOnce
            # SIZE THIS FOR WRITE THROUGHPUT x DURATION, NOT FOR THE DATASET.
            #
            # 50Gi was the original value, derived from the logical dataset size
            # (20M rows x ~550B = ~11 GB/node). That is the wrong calculation and
            # it took two of three nodes down during a rehearsal.
            #
            # Cassandra is append-only. The sustained job overwrites the same 20M
            # bounded keys for 3 hours at ~30k writes/sec, and every overwrite
            # creates a new sstable generation. UCS could not merge them fast
            # enough: 66 live sstables, 44 GB, disks at 94-99%. The commitlog then
            # hit "No space left on device", commit_failure_policy=stop did its
            # job, and the nodes shut down - WHILE THEIR PODS STAYED 3/3 RUNNING,
            # so nothing in kubectl looked wrong.
            #
            # Medusa also stages backups on this same volume (the sidecar mounts
            # server-data), and a full backup pins sstables against deletion for
            # the whole upload window while compaction writes new ones.
            #
            # 150Gi leaves ~100 GB free at the observed steady state. Watch
            # Grafana panel 13, "Projected hours until PVC full": if that number
            # is smaller than the load job's remaining runtime, the cluster will
            # go down before the job finishes.
            resources:
              requests:
                storage: 150Gi

        resources:
          requests:
            cpu: "12"
            memory: "32Gi"
          limits:
            # A CPU limit is MANDATORY here, and that is not a free choice.
            # cass-operator's validating webhook rejects the datacenter with
            #   "attempted to use multiple nodes per worker without cpu and
            #    memory requests and limits"
            # whenever softPodAntiAffinity is on. So co-locating pods and
            # omitting the CPU limit are mutually exclusive — and omitting the
            # limit is exactly the fix for the CFS throttling that capped the
            # previous run at 6.0/6.0 CPU while the hosts idled at 30-70%.
            #
            # 14 is sized for TWO pods per worker (2 x 14 = 28 on a 31.5-CPU
            # node), which is what the 3 -> 6 scale demo produces.
            #
            # AT RING SIZE 3 THIS LIMIT BINDS, AND THAT IS DELIBERATE. Measured
            # under the sustained 50/50 load with one pod per worker:
            #
            #   container CPU        11.9 - 14.6 cores  (limit 14)
            #   CFS periods throttled     0.10 - 0.22 %
            #   worker node CPU              20 - 32 %
            #
            # Pods pressed against the cgroup quota while the hosts idle — the
            # same signature as the earlier run that capped at 6.0/6.0 CPU, just
            # milder. Strictly, at size 3 each pod has a whole worker to itself
            # and this quota costs throughput for nothing.
            #
            # It is kept because it makes the workshop's central finding LIVE
            # rather than recounted: /diagnose can find real throttling on the
            # Grafana "CFS throttling" panel. It is NOT raised on stage (a CR edit
            # rolls the ring for ~9.5 min). Do not "fix" it without reading
            # docs/talk-outline.md Beat 5 first.
            #
            # Consequence to state out loud: throughput numbers measured here
            # come from a deliberately constrained cluster.
            cpu: "14"
            memory: "32Gi"

        config:
          cassandraYaml:
            # NOTE: Cassandra 5.0 renamed several of these settings and refuses
            # to start if both the old and new spellings are present:
            #   "Config contains both old and new keys for the same configuration
            #    parameters, migrate old -> new"
            # The operator's own defaults already use the new names, so only the
            # new ones may appear here — and they require units.
            dynamic_snitch_badness_threshold: 0.1

            # auto_snapshot: the default is TRUE, and it fires on both DROP and
            # TRUNCATE. The snapshot hard-links every sstable, so dropping a table
            # frees NOTHING -- the data sits on disk forever under a
            # `dropped-<timestamp>-<table>` tag.
            #
            # Measured here: replacing the `baselines.keyvalue` workload with the
            # payments model left 59 GiB of snapshots across three nodes for a
            # keyspace that no longer exists in the schema at all
            # (`nodetool describering baselines` -> "No such keyspace").
            #
            # Worse, the obvious check lies. `nodetool listsnapshots` PRINTS the
            # 22.54 GiB snapshot as a line item and then reports
            # "Total TrueDiskSpaceUsed: 457.76 KiB" -- the total silently omits it,
            # because the keyspace is gone from the schema and it cannot be
            # attributed. `nodetool status` Load only ever counts live data. So the
            # two Cassandra-native views said 7.6 GiB while the PVC said 31.7 GiB,
            # and only the Kubernetes disk panel told the truth.
            #
            # This is a workshop cluster that gets torn down, rebuilt and reloaded
            # repeatedly, so the safety net costs far more than it is worth. On a
            # production cluster leave it TRUE -- it is the thing that saves you
            # from a mistaken DROP -- and prune deliberately instead.
            auto_snapshot: false

            # --- Durability settings, from cassandra-expert references ---
            #
            # commit_failure_policy: the operator default is `stop`, which halts
            # CQL and gossip but LEAVES THE JVM RUNNING. On Kubernetes that is
            # actively harmful: the container stays alive, the pod stays 3/3
            # Running, and `kubectl get pods` shows nothing wrong while the node
            # is dead to the ring. That is exactly how a full disk took two of
            # three nodes down here without any Kubernetes-visible signal.
            #
            # `die` exits the JVM, so the container terminates, the kubelet
            # restarts it, and a persistent failure surfaces as CrashLoopBackOff
            # — a signal Kubernetes and any dashboard already understand.
            # (references/general/commitlog.md recommends `die` wherever a
            # supervisor restarts the process; on Kubernetes there always is one.)
            commit_failure_policy: die

            # The 10s default is documented as "appropriate only for slow
            # spinning disks". Storage here is network-attached (Ceph RBD on
            # OpenShift, EBS on EKS), for which the guidance is 2s. With RF=3 at
            # LOCAL_QUORUM the write is already on three nodes, so the exposure
            # from periodic sync is small either way — but 10s is 5x more
            # unflushed data to replay after a crash, which is what made the
            # recovery slow enough for the operator to kill the pod mid-replay.
            commitlog_sync_period: 2000ms

            key_cache_size: 200MiB
            stream_throughput_outbound: 100MiB/s
            compaction_throughput: 32MiB/s
          jvmOptions:
            heapSize: 8G
            gc: G1GC

        telemetry:
          prometheus:
            enabled: true
            commonLabels:
              release: kps

  reaper:
    deploymentMode: PER_DC
    storageType: cassandra
    keyspace: reaper_db
    heapSize: 2Gi
    autoScheduling:
      enabled: false
    resources:
      requests:
        cpu: "1"
        memory: "3Gi"
      limits:
        memory: "4Gi"
    # The Reaper image hardcodes `sessionTimeout: PT10M` with no env var for it,
    # and that is also the JWT lifetime. The web UI polls with its stored token
    # and shows "no cluster" on the resulting 401 instead of returning to the
    # login page, so a tab opened at T-25 is blank by Beat 4. Reaper is a
    # Dropwizard app, so a -Ddw.* system property overrides any config key.
    # JWT_SECRET replaces the default key published in the image's own config;
    # deploy-openshift.sh generates it.
    # Same login as Grafana, so there is one credential to remember on stage.
    # deploy-openshift.sh copies it from the kps-grafana secret. The operator's
    # own demo-reaper-ui secret cannot be edited: it is hash-managed and reverts.
    uiUserSecretRef:
      name: reaper-ui
    additionalEnvVars:
      - name: JAVA_OPTS
        value: "-Ddw.accessControl.sessionTimeout=PT3H"
      - name: JWT_SECRET
        valueFrom:
          secretKeyRef:
            name: reaper-jwt
            key: secret
    telemetry:
      prometheus:
        enabled: true
        commonLabels:
          release: kps

  medusa:
    storageProperties:
      # MinIO, deployed by manifests/openshift/minio.yaml. s3_compatible with an
      # explicit host rather than storageProvider: s3 with a region -- there is
      # no AWS here at all.
      #
      # NOT NooBaa. OpenShift Data Foundation's Multicloud Object Gateway is the
      # obvious in-cluster S3 on paper, and it does not work for this workload.
      # See docs/TROUBLESHOOTING.md ("Medusa backup fails with InvalidBucketState")
      # for the measurements; the short version is that its pv-pool agent pods
      # are pinned at 400Mi by the operator, no CRD exposes that limit, and they
      # are OOMKilled ~75s into a full backup of a loaded ring.
      storageProvider: s3_compatible
      host: minio.default.svc.cluster.local
      port: 9000
      # Plain HTTP on a ClusterIP Service that is never routed outside the
      # cluster. Both keys must be set EXPLICITLY -- left unset they render as
      # `False` in medusa.ini anyway, but only by accident. See pitfall 11.
      secure: false
      sslVerify: false
      region: us-east-1  # ignored by MinIO, but the S3 client requires a value
      bucketName: medusa-backups
      storageSecretRef:
        # Written by scripts/deploy-openshift.sh in INI format. Medusa wants a
        # `credentials` key, not AWS_*-style environment variables.
        name: medusa-minio-key
      prefix: demo
      transferMaxBandwidth: 150MB/s
      concurrentTransfers: 4
      maxBackupCount: 3
    containerResources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "4Gi"
    purgeBackups: true
