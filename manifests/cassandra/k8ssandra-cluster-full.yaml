# FULL PROFILE — sized for the 9-node webcast cluster (eksctl-cluster-full.yaml).
# The default trial profile is k8ssandra-cluster.yaml; comments there explain the
# reasoning behind each setting. Only the sizing differs.
apiVersion: k8ssandra.io/v1alpha1
kind: K8ssandraCluster
metadata:
  name: demo
  namespace: default
spec:
  cassandra:
    serverVersion: "5.0.8"
    # IRSA service account — this is how Medusa's sidecar reaches S3 without
    # long-lived AWS keys. Created out-of-band; see manifests/infra/medusa-irsa.md.
    serviceAccount: medusa-backup
    datacenters:
      - metadata:
          name: dc1
        # Deploy at 6 (2 nodes per rack), scale to 9 live during the talk.
        #
        # With racks, size MUST stay a multiple of 3 or the ring goes unbalanced.
        # That is why the scale demo is 6 -> 9 rather than 3 -> 6 -> 9.
        size: 6

        # Rack-per-AZ. This replaces the softPodAntiAffinity: true that used to
        # be here. The previous attempt (2 racks across us-east-1a/1b) stalled
        # during bootstrap because Cassandra's default
        # allocate_tokens_for_local_replication_factor=3 needs 3 racks to
        # allocate tokens. The eksctl config now pins 3 AZs, so it works.
        #
        # Omitting softPodAntiAffinity leaves cass-operator's default hard pod
        # anti-affinity in place: at most one Cassandra pod per node, so losing
        # an EC2 instance costs exactly one replica.
        racks:
          - name: rack1
            nodeAffinityLabels:
              topology.kubernetes.io/zone: us-east-1a
          - name: rack2
            nodeAffinityLabels:
              topology.kubernetes.io/zone: us-east-1b
          - name: rack3
            nodeAffinityLabels:
              topology.kubernetes.io/zone: us-east-1c


        # The Vector log-tailer sidecar ships with a 128Mi limit and sits at
        # 119-122Mi in steady state - no headroom at all. During a scale-under-load
        # rehearsal it OOMKilled (exit 137) on multiple pods.
        #
        # Nothing was actually wrong with Cassandra: it stayed at ~9.9 GiB of its
        # 32 GiB limit and never left the ring. But the POD reported 2/3 Ready, so
        # anything watching pod readiness saw a degraded cluster that was fine.
        # (That is the exact inverse of the disk-full failure, where the pod said
        # 3/3 Running and Cassandra was dead. Neither direction is trustworthy on
        # its own.)
        containers:
          - name: server-system-logger
            # This sidecar is Vector, and its whole job is to tail ONE file
            # (/var/log/cassandra/system.log, a few hundred KB) and echo it to
            # stdout so `kubectl logs` works.
            #
            # Vector sizes its worker pool from the CPU count it can see. This
            # container has no CPU limit, so it sees the whole node -- 32 cores
            # -- and starts ~34 threads. The memory cost is per-thread allocator
            # arenas, NOT buffered log data: nothing is backing up, and the
            # working set is flat (measured +0.2 MiB over four days).
            #
            # MEASURED on this cluster, identical image, idle:
            #   stock              34 threads   157 MiB
            #   VECTOR_THREADS=2    4 threads    33 MiB
            #
            # That is why 128Mi OOMKilled during the 3->6 scale-up: Vector's
            # normal floor was already ABOVE the limit. It was not a burst and
            # not a leak, so raising the ceiling was treating the symptom.
            # Capping the thread count fixes the cause, and 128Mi is then real
            # headroom over an ~80 MiB steady state rather than a ceiling to
            # creep towards.
            env:
              - name: VECTOR_THREADS
                value: "2"
            resources:
              requests:
                memory: 64Mi
              limits:
                memory: 128Mi
        # storageConfig is IMMUTABLE on an existing CassandraDatacenter. If you
        # ever need to resize these PVCs, add this annotation to the datacenter
        # metadata above FIRST:
        #   cassandra.datastax.com/allow-storage-changes: "true"
        # Without it the validating webhook rejects the entire CassandraDatacenter
        # write, which silently blocks every OTHER config change in this CR too.
        storageConfig:
          cassandraDataVolumeClaimSpec:
            storageClassName: ebs-gp3
            accessModes:
              - ReadWriteOnce
            # Medusa stages backups on this same volume (the sidecar mounts
            # server-data), and a full backup pins sstables against deletion for
            # the whole upload window while compaction writes new ones. Budget
            # live data + compaction headroom + one full backup's worth.
            resources:
              requests:
                storage: 60Gi

        resources:
          requests:
            cpu: "11"
            memory: "32Gi"
          limits:
            # Deliberately NO cpu limit. The last run was pegged at 6.0/6.0 CPU
            # while the EC2 hosts idled at 30-70% — CFS throttling at the cgroup
            # level, invisible to nodetool tpstats, costing ~8k ops/sec. With no
            # cpu limit the cgroup's cpu.max is "max" and the quota mechanism
            # that throttled us is simply not installed. requests: 12 still
            # guarantees the share under contention.
            memory: "32Gi"

        config:
          cassandraYaml:
            # NOTE: Cassandra 5.0 renamed several of these settings and refuses
            # to start if both the old and new spellings are present:
            #   "Config contains both old and new keys for the same configuration
            #    parameters, migrate old -> new"
            # The operator's own defaults already use the new names, so only the
            # new ones may appear here — and they require units.
            # Default 1.0 lets the dynamic snitch ignore all but 100%-worse
            # replicas; at sub-ms latencies this creates a self-reinforcing
            # hot replica. 0.1 is the documented modern recommendation.
            dynamic_snitch_badness_threshold: 0.1

            # auto_snapshot: the default is TRUE, and it fires on both DROP and
            # TRUNCATE. The snapshot hard-links every sstable, so dropping a table
            # frees NOTHING -- the data sits on disk forever under a
            # `dropped-<timestamp>-<table>` tag.
            #
            # Measured here: replacing the `baselines.keyvalue` workload with the
            # payments model left 59 GiB of snapshots across three nodes for a
            # keyspace that no longer exists in the schema at all
            # (`nodetool describering baselines` -> "No such keyspace").
            #
            # Worse, the obvious check lies. `nodetool listsnapshots` PRINTS the
            # 22.54 GiB snapshot as a line item and then reports
            # "Total TrueDiskSpaceUsed: 457.76 KiB" -- the total silently omits it,
            # because the keyspace is gone from the schema and it cannot be
            # attributed. `nodetool status` Load only ever counts live data. So the
            # two Cassandra-native views said 7.6 GiB while the PVC said 31.7 GiB,
            # and only the Kubernetes disk panel told the truth.
            #
            # This is a workshop cluster that gets torn down, rebuilt and reloaded
            # repeatedly, so the safety net costs far more than it is worth. On a
            # production cluster leave it TRUE -- it is the thing that saves you
            # from a mistaken DROP -- and prune deliberately instead.
            auto_snapshot: false

            # --- Durability settings, from cassandra-expert references ---
            #
            # commit_failure_policy: the operator default is `stop`, which halts
            # CQL and gossip but LEAVES THE JVM RUNNING. On Kubernetes that is
            # actively harmful: the container stays alive, the pod stays 3/3
            # Running, and `kubectl get pods` shows nothing wrong while the node
            # is dead to the ring. That is exactly how a full disk took two of
            # three nodes down here without any Kubernetes-visible signal.
            #
            # `die` exits the JVM, so the container terminates, the kubelet
            # restarts it, and a persistent failure surfaces as CrashLoopBackOff
            # — a signal Kubernetes and any dashboard already understand.
            # (references/general/commitlog.md recommends `die` wherever a
            # supervisor restarts the process; on Kubernetes there always is one.)
            commit_failure_policy: die

            # The 10s default is documented as "appropriate only for slow
            # spinning disks". Storage here is network-attached (Ceph RBD on
            # OpenShift, EBS on EKS), for which the guidance is 2s. With RF=3 at
            # LOCAL_QUORUM the write is already on three nodes, so the exposure
            # from periodic sync is small either way — but 10s is 5x more
            # unflushed data to replay after a crash, which is what made the
            # recovery slow enough for the operator to kill the pod mid-replay.
            commitlog_sync_period: 2000ms


            # The operator default is 0, which silently makes the table-level
            # caching = {'keys':'ALL'} setting meaningless. (/optimize Tier-1)
            key_cache_size: 200MiB

            # Load-bearing for the live scale demo. At the 201 Mbps default, a
            # joining node receiving ~11 GB takes ~7 minutes, and bootstraps are
            # serial. 800 Mbps brings it to ~2 minutes per node.
            stream_throughput_outbound: 100MiB/s

            compaction_throughput: 32MiB/s

            # num_tokens is IMMUTABLE after create — a wrong value means a full
            # teardown. /optimize recommends 4 (and it triggers the operator's
            # deterministic initial-token computation, which only runs below 16),
            # but validate it on the trial cluster before committing.
            # num_tokens: 4

          jvmOptions:
            heapSize: 8G
            gc: G1GC

        telemetry:
          prometheus:
            enabled: true
            # Must match the kube-prometheus-stack Helm release name so its
            # Prometheus selects the ServiceMonitor the operator writes.
            commonLabels:
              release: kps

  # Anti-entropy repair orchestration.
  reaper:
    deploymentMode: PER_DC
    storageType: cassandra   # stores schedules in Cassandra itself; no PVC needed
    keyspace: reaper_db
    heapSize: 2Gi
    autoScheduling:
      # Off so the repair triggered live during the talk is the only one running.
      enabled: false
    resources:
      requests:
        cpu: "1"
        memory: "3Gi"
      limits:
        memory: "4Gi"
    telemetry:
      prometheus:
        enabled: true
        commonLabels:
          release: kps

  # Backup/restore to S3.
  medusa:
    storageProperties:
      storageProvider: s3
      # IRSA. The reconciler rejects setting credentialsType AND storageSecretRef
      # together — if you fall back to static keys, remove credentialsType.
      credentialsType: role-based
      # NOTE: replace with the real bucket. scripts/deploy.sh fails fast if this
      # placeholder is still here. See manifests/infra/medusa-irsa.md.
      bucketName: REPLACE_WITH_MEDUSA_BUCKET
      region: us-east-1
      prefix: demo
      # These two render as False in the generated medusa.ini if omitted, which
      # breaks uploads to real AWS S3. They must be set explicitly.
      secure: true
      sslVerify: true
      transferMaxBandwidth: 150MB/s
      concurrentTransfers: 4
      maxBackupCount: 3
    containerResources:
      requests:
        cpu: "500m"
        memory: "1Gi"
      limits:
        memory: "4Gi"
    purgeBackups: true
