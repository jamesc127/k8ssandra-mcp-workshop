# NoSQLBench PREPARE job — run once, well before the demo.
#
# Creates the schema and bulk-loads the dataset. Split out from the main load
# job so that the main job can run multiple pods in parallel without them racing
# on schema creation and each repeating the rampup.
#
# TRIAL profile: 20M rows at 100k ops/sec = ~200s, plus compaction settle time.
# Keep the cycles= value in step with the Mod()/Uniform() bounds in
# nosqlbench-configmap.yaml.
#
# To re-run:
#   kubectl delete job nosqlbench-prepare -n default
#   kubectl apply -f manifests/loadtest/nosqlbench-prepare-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: nosqlbench-prepare
  namespace: default
  labels:
    app: nosqlbench
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: nosqlbench
    spec:
      restartPolicy: OnFailure
      # Pin to the dedicated load-generator node. The taint on that node is what
      # keeps Cassandra off it; these two settings are what put us on it.
      nodeSelector:
        workload: loadgen
      tolerations:
        - key: workload
          value: loadgen
          effect: NoSchedule
      volumes:
        - name: workload
          configMap:
            name: nb-cql-keyvalue
      containers:
        - name: nosqlbench
          image: nosqlbench/nosqlbench:5.25.16
          volumeMounts:
            - name: workload
              mountPath: /workloads
          env:
            - name: CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-superuser
                  key: username
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-superuser
                  key: password
          command: ["/bin/bash", "-c"]
          args:
            - |
              NB="java -jar /nb5.jar"
              HOST=demo-dc1-all-pods-service
              DC=dc1
              echo "=== NoSQLBench PREPARE ==="
              echo "Target: $HOST | DC: $DC | User: $CASSANDRA_USERNAME"
              echo ""
              # errors=count on the schema phase is deliberate. On a fresh
              # multi-node cluster, CREATE KEYSPACE/TABLE can take longer than
              # the driver's 2s default request timeout while the nodes reach
              # schema agreement. The DDL succeeds server-side, but the client
              # gives up and the cqld4 adapter's default "stop" handler aborts
              # the whole job before rampup ever starts. The statements use
              # IF NOT EXISTS, so counting the timeout instead of dying is safe.
              echo "Phase 1: Schema creation"
              $NB run driver=cqld4 workload=/workloads/cql-keyvalue.yaml tags=block:schema threads=1 errors=count host=$HOST localdc=$DC username=$CASSANDRA_USERNAME password=$CASSANDRA_PASSWORD
              echo ""
              # Re-run the (idempotent) schema block until it completes without
              # a timeout. The first attempt on a fresh cluster often exceeds the
              # driver's 2s request timeout while nodes reach schema agreement;
              # by the second attempt the objects exist and CREATE IF NOT EXISTS
              # returns immediately.
              echo "Confirming schema agreement..."
              for attempt in 1 2 3 4 5; do
                if $NB run driver=cqld4 workload=/workloads/cql-keyvalue.yaml tags=block:schema threads=1 \
                     host=$HOST localdc=$DC username=$CASSANDRA_USERNAME password=$CASSANDRA_PASSWORD > /tmp/schema.log 2>&1; then
                  echo "  schema confirmed on attempt $attempt"
                  break
                fi
                echo "  attempt $attempt did not settle, retrying..."
                sleep 10
                if [ "$attempt" = 5 ]; then
                  echo "ERROR: schema never settled. Last output:"; tail -20 /tmp/schema.log; exit 1
                fi
              done
              echo ""
              echo "Phase 2: Bulk load 20M rows at 100k ops/sec (~200s)"
              $NB run driver=cqld4 workload=/workloads/cql-keyvalue.yaml tags=block:rampup host=$HOST localdc=$DC username=$CASSANDRA_USERNAME password=$CASSANDRA_PASSWORD cycles=20M cyclerate=100000 threads=500 errors=count --progress console:10s
              echo ""
              echo "=== Prepare complete ==="
          resources:
            requests:
              memory: "8Gi"
              cpu: "16"
            limits:
              # No cpu limit — this job owns the loadgen node while it runs.
              memory: "12Gi"
