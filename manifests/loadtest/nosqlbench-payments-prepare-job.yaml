# Payments PREPARE job - schema + bulk load. Run once, well before any demo.
#
# SIZING IS MEASURED, NOT ESTIMATED. A 1M-row sample loaded into all three
# tables occupied 222.7 MB per node after flush:
#   transactions_by_card       83.2 MB   compression 0.512 (~2x)
#   transactions_by_id         69.0 MB   compression 0.590
#   transactions_by_merchant   70.5 MB   compression 0.578
# So 50M transactions => ~11.1 GB/node of live data, comfortably over the 10 GB
# floor and well inside the 150Gi PVCs.
#
# At 50M cycles the partitions are properly wide:
#   by_card      100k cards x 6 monthly buckets  => ~83 rows/partition (~27 KB)
#   by_merchant  2k merchants x 181 daily buckets => ~138 rows/partition (~20 KB)
# Both far under the 10 MB partition guideline, both wide enough that the
# LIMIT 20 statement query is a genuine slice.
#
# One block per table, run sequentially, so all three views hold the SAME row
# set. A ratio-based mix would send each cycle to one table only and leave the
# denormalized views inconsistent.
#
# Runtime: 150M inserts at 80k/s is roughly 30 minutes. Never run this live.
apiVersion: batch/v1
kind: Job
metadata:
  name: nosqlbench-payments-prepare
  namespace: default
  labels:
    app: nosqlbench
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: nosqlbench
    spec:
      restartPolicy: OnFailure
      nodeSelector:
        workload: loadgen
      tolerations:
        - key: workload
          value: loadgen
          effect: NoSchedule
      volumes:
        - name: workload
          configMap:
            name: nb-cql-payments
      containers:
        - name: nosqlbench
          image: nosqlbench/nosqlbench:5.25.16
          volumeMounts:
            - name: workload
              mountPath: /workloads
          env:
            - name: CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef: {name: demo-superuser, key: username}
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef: {name: demo-superuser, key: password}
          command: ["/bin/bash", "-c"]
          args:
            - |
              NB="java -jar /nb5.jar"
              W=/workloads/cql-payments.yaml
              HOST=demo-dc1-all-pods-service
              DC=dc1
              A="host=$HOST localdc=$DC username=$CASSANDRA_USERNAME password=$CASSANDRA_PASSWORD"
              CYCLES=${CYCLES:-50M}

              echo "=== Payments PREPARE: schema ==="
              # errors=count: on a fresh multi-node cluster the DDL can exceed the
              # driver's 2s request timeout while nodes reach schema agreement.
              # The statements are IF NOT EXISTS, so counting the timeout is safe.
              $NB run driver=cqld4 workload=$W tags=block:schema threads=1 errors=count $A

              echo "Confirming schema agreement..."
              for attempt in 1 2 3 4 5; do
                if $NB run driver=cqld4 workload=$W tags=block:schema threads=1 $A > /tmp/schema.log 2>&1; then
                  echo "  schema confirmed on attempt $attempt"; break
                fi
                echo "  attempt $attempt did not settle, retrying..."; sleep 10
                if [ "$attempt" = 5 ]; then
                  echo "ERROR: schema never settled."; tail -20 /tmp/schema.log; exit 1
                fi
              done

              for b in rampup_card rampup_id rampup_merchant; do
                echo ""
                echo "=== Payments PREPARE: $b ($CYCLES rows) ==="
                $NB run driver=cqld4 workload=$W tags=block:$b \
                  cycles=$CYCLES cyclerate=80000 threads=500 errors=count \
                  $A --progress console:30s
              done
              echo ""
              echo "=== Prepare complete ==="
          resources:
            requests:
              memory: "8Gi"
              cpu: "16"
            limits:
              memory: "12Gi"
