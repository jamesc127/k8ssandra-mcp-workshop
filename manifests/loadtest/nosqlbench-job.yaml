# NoSQLBench MAIN load job — the sustained read/write workload.
#
# Schema creation and the bulk load now live in nosqlbench-prepare-job.yaml.
# Run that first; this job assumes the dataset already exists.
#
# TRIAL profile: 1 pod at 60k ops/sec. Three Cassandra nodes at ~12 effective
# cores each sustain roughly 80k, so 60k leaves headroom.
#   FULL profile: parallelism/completions 2, cyclerate 100000 each = 200k ops/sec.
#
# cycles = cyclerate x seconds. 60000 x 10800 = 648M = 3 hours, long enough to
# start well before a talk and still be running through Q&A.
#
# Uses threads=400 explicitly — threads=auto picks too few threads to
# sustain six-figure throughput regardless of cyclerate.
#
# Uses errors=count so transient errors (driver timeouts during chaos events
# like rolling restarts or pod failures) are recorded in metrics but do not
# abort the activity. The cqld4 adapter's default error handler is "stop",
# which aborts the whole scenario on the first error — wrong for chaos testing.
#
# To re-run, delete the old job first:
#   kubectl delete job nosqlbench-load -n default
#   kubectl apply -f manifests/loadtest/nosqlbench-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: nosqlbench-load
  namespace: default
  labels:
    app: nosqlbench
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: nosqlbench
    spec:
      restartPolicy: OnFailure
      # Pin to the dedicated load-generator node. This replaces the old soft
      # pod anti-affinity, which silently became a no-op once every node was
      # running a Cassandra pod — exactly the case that inflated p50 read
      # latency 3-4x on the co-located node.
      nodeSelector:
        workload: loadgen
      tolerations:
        - key: workload
          value: loadgen
          effect: NoSchedule
      volumes:
        - name: workload
          configMap:
            name: nb-cql-keyvalue
      containers:
        - name: nosqlbench
          image: nosqlbench/nosqlbench:5.25.16
          volumeMounts:
            - name: workload
              mountPath: /workloads
          env:
            - name: CASSANDRA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: demo-superuser
                  key: username
            - name: CASSANDRA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: demo-superuser
                  key: password
          command: ["/bin/bash", "-c"]
          args:
            - |
              NB="java -jar /nb5.jar"
              HOST=demo-dc1-all-pods-service
              DC=dc1
              echo "=== NoSQLBench CQL KeyValue - main workload ==="
              echo "Target: $HOST | DC: $DC | User: $CASSANDRA_USERNAME"
              echo ""
              echo "3 hours of mixed 50/50 read/write at 60k ops/sec"
              $NB run driver=cqld4 workload=/workloads/cql-keyvalue.yaml tags=block:main host=$HOST localdc=$DC username=$CASSANDRA_USERNAME password=$CASSANDRA_PASSWORD cycles=648M cyclerate=60000 threads=400 errors=count --progress console:10s
              echo ""
              echo "=== Workload complete ==="
          resources:
            requests:
              memory: "8Gi"
              cpu: "12"
            limits:
              # No cpu limit — CFS throttling the load generator would cap
              # throughput just as surely as throttling Cassandra did.
              memory: "12Gi"
